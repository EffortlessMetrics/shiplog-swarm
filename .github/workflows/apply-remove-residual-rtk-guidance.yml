name: Apply residual RTK cleanup
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/remove-residual-rtk-guidance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/remove-residual-rtk-guidance
          fetch-depth: 0
      - name: Apply bounded replacements
        run: |
          set -euo pipefail
          files=(
            plans/shiplog-swarm/current-promotion.md
            plans/shiplog-swarm/implementation-plan.md
            xtask/src/tasks/closeout.rs
            xtask/src/tasks/pr_body.rs
            xtask/src/tasks/repo_contract_report.rs
          )
          changed=0
          for file in "${files[@]}"; do
            if [ -f "$file" ] && grep -q 'rtk ' "$file"; then
              perl -pi -e 's/rtk //g' "$file"
              changed=1
            fi
          done
          if [ "$changed" = 0 ]; then
            exit 0
          fi
          git diff --check
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add "${files[@]}"
          git commit -m 'docs: remove RTK from promotion guidance and generators'
          git push origin HEAD:agent/remove-residual-rtk-guidance
