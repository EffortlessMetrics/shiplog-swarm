name: Restore historical RTK receipt wording
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.pull_request.head.ref == 'agent/remove-residual-rtk-guidance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/remove-residual-rtk-guidance
          fetch-depth: 0
      - name: Restore recorded command provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plans/shiplog-swarm/implementation-plan.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('copyable `cargo xtask` prefixes; source post-merge routed CI, CI,',
               'copyable `rtk cargo xtask` prefixes; source post-merge routed CI, CI,'),
              ('uses the repo-required `cargo xtask repo-contract-report`\n'
               '          spelling; source post-merge routed CI, CI, smoke, security, testing,',
               'uses the repo-required `rtk cargo xtask repo-contract-report`\n'
               '          spelling; source post-merge routed CI, CI, smoke, security, testing,'),
              ('and reran\n          `cargo xtask repo-contract-report` with 0 source and 0 swarm',
               'and reran\n          `rtk cargo xtask repo-contract-report` with 0 source and 0 swarm'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected historical receipt text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add plans/shiplog-swarm/implementation-plan.md
          git commit -m 'docs: preserve historical RTK receipt wording'
          git push origin HEAD:agent/remove-residual-rtk-guidance
