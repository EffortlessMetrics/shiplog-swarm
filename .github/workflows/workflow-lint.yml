name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.*"
      - ".github/jactionlint.*"
      - ".github/dependabot.*"
      - "**/action.yml"
      - "**/action.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jactionlint:
    name: GitHub Actions correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d # v2.5.0
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
