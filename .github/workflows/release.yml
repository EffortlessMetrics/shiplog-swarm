name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semver tag to release, e.g. v0.8.1"
        required: true
        type: string
      owner_approved_release_execution:
        description: "Owner explicitly approved release execution"
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Prove the package surface and resolve one immutable tagged source commit.
  release-preflight:
    name: Release Preflight
    runs-on: ${{ github.repository == 'EffortlessMetrics/shiplog-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      release_sha: ${{ steps.release_commit.outputs.release_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_OWNER_APPROVED: ${{ inputs.owner_approved_release_execution }}
        run: |
          set -euo pipefail

          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_OWNER_APPROVED" != "true" ]]; then
              echo "manual release workflow dispatch requires owner approval" >&2
              exit 1
            fi
            tag="$INPUT_RELEASE_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release workflow requires an explicit semver tag like v0.8.1; got '$tag'" >&2
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.release_tag }}"
          git fetch --force --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git checkout --detach "$tag"

      - name: Resolve immutable release commit
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.release_tag }}"
          release_sha="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [[ "$release_sha" != "$tag_commit" ]]; then
            echo "checked out $release_sha, but $tag resolves to $tag_commit" >&2
            exit 1
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag did not resolve to a full commit SHA" >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Release hold guard
        run: bash scripts/check-release-hold.sh "${{ steps.release_tag.outputs.release_tag }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-preflight"

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Package proof
        run: ./scripts/package-proof.sh

      - name: Publish dry run (allowlist)
        run: scripts/publish-dry-run.sh

  # Build the exact tagged binary on every supported target.
  build-binary:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: release-preflight
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ''
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p shiplog --locked

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/shiplog${{ matrix.ext }}"
          dest="dist/shiplog-${{ matrix.target }}${{ matrix.ext }}"
          if [[ ! -f "$src" ]]; then
            echo "missing expected binary: $src" >&2
            find target -maxdepth 4 -type f -name 'shiplog*' -print >&2 || true
            exit 1
          fi
          cp "$src" "$dest"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shiplog-${{ matrix.target }}
          path: dist/shiplog-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 5

  # Swarm records the source handoff; canonical source creates the draft release.
  create-release:
    name: Create Release
    runs-on: ${{ github.repository == 'EffortlessMetrics/shiplog-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    needs: [release-preflight, build-binary]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=${{ needs.release-preflight.outputs.release_tag }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Record source release handoff
        shell: bash
        run: |
          echo "Swarm verifies release inputs but cannot create a GitHub release."
          echo "Promote this exact proven tree to EffortlessMetrics/shiplog for authorized release execution." >> "$GITHUB_STEP_SUMMARY"

  # Assemble one immutable workflow-staged candidate set before acceptance.
  upload-assets:
    name: Stage Release Candidates
    runs-on: ${{ github.repository == 'EffortlessMetrics/shiplog-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    needs: [release-preflight, build-binary, create-release]
    outputs:
      candidate_artifact_id: ${{ steps.candidates.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.candidates.outputs.artifact-digest }}
      candidate_manifest_sha256: ${{ steps.candidate_manifest.outputs.candidate_manifest_sha256 }}
      checksum_manifest_sha256: ${{ steps.candidate_manifest.outputs.checksum_manifest_sha256 }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate candidate manifest and checksums
        id: candidate_manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          expected=(
            "shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu"
            "shiplog-x86_64-apple-darwin/shiplog-x86_64-apple-darwin"
            "shiplog-aarch64-apple-darwin/shiplog-aarch64-apple-darwin"
            "shiplog-x86_64-pc-windows-msvc/shiplog-x86_64-pc-windows-msvc.exe"
          )
          for path in "${expected[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "missing expected staged binary: $path" >&2
              find . -maxdepth 3 -type f -print >&2
              exit 1
            fi
          done

          : > SHA256SUMS.txt
          for path in "${expected[@]}"; do
            sha256sum "$path" >> SHA256SUMS.txt
          done
          checksum_manifest_sha256="$(sha256sum SHA256SUMS.txt | awk '{print $1}')"

          cat > RELEASE_CANDIDATE.txt <<EOF
          schema_version=1
          release_tag=${{ needs.release-preflight.outputs.release_tag }}
          source_sha=${{ needs.release-preflight.outputs.release_sha }}
          repository=${{ github.repository }}
          workflow_run_id=${{ github.run_id }}
          workflow_run_attempt=${{ github.run_attempt }}
          asset_count=4
          checksum_manifest_sha256=$checksum_manifest_sha256
          EOF
          sed -i 's/^          //' RELEASE_CANDIDATE.txt

          candidate_manifest_sha256="$(sha256sum RELEASE_CANDIDATE.txt | awk '{print $1}')"
          echo "checksum_manifest_sha256=$checksum_manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "candidate_manifest_sha256=$candidate_manifest_sha256" >> "$GITHUB_OUTPUT"
          cat RELEASE_CANDIDATE.txt
          cat SHA256SUMS.txt

      - name: Retain exact staged release candidates
        id: candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-candidates
          path: |
            artifacts/shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu
            artifacts/shiplog-x86_64-apple-darwin/shiplog-x86_64-apple-darwin
            artifacts/shiplog-aarch64-apple-darwin/shiplog-aarch64-apple-darwin
            artifacts/shiplog-x86_64-pc-windows-msvc/shiplog-x86_64-pc-windows-msvc.exe
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE_CANDIDATE.txt
          retention-days: 5

      - name: Record staged candidate identity
        shell: bash
        run: |
          {
            echo "## Workflow-staged candidate"
            echo "- Tag: \`${{ needs.release-preflight.outputs.release_tag }}\`"
            echo "- Source commit: \`${{ needs.release-preflight.outputs.release_sha }}\`"
            echo "- Artifact id: \`${{ steps.candidates.outputs.artifact-id }}\`"
            echo "- Artifact digest: \`${{ steps.candidates.outputs.artifact-digest }}\`"
            echo "- Candidate manifest SHA-256: \`${{ steps.candidate_manifest.outputs.candidate_manifest_sha256 }}\`"
            echo "- Checksum manifest SHA-256: \`${{ steps.candidate_manifest.outputs.checksum_manifest_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Validate the staged candidate while retaining independent release-mode checks.
  release-validation:
    name: Release Validation
    runs-on: ${{ github.repository == 'EffortlessMetrics/shiplog-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    needs: [release-preflight, upload-assets]

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Download staged candidate set
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidates
          path: candidate

      - name: Verify staged candidate identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "schema_version=1" candidate/RELEASE_CANDIDATE.txt
          grep -Fxq "release_tag=${{ needs.release-preflight.outputs.release_tag }}" candidate/RELEASE_CANDIDATE.txt
          grep -Fxq "source_sha=${{ needs.release-preflight.outputs.release_sha }}" candidate/RELEASE_CANDIDATE.txt
          grep -Fxq "asset_count=4" candidate/RELEASE_CANDIDATE.txt
          expected="$(sed -n 's/^checksum_manifest_sha256=//p' candidate/RELEASE_CANDIDATE.txt)"
          actual="$(sha256sum candidate/SHA256SUMS.txt | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(sha256sum candidate/RELEASE_CANDIDATE.txt | awk '{print $1}')" = "${{ needs.upload-assets.outputs.candidate_manifest_sha256 }}"

      - name: Smoke staged Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          binary="candidate/shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu"
          expected="$(awk '$2 == "shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu" {print $1}' candidate/SHA256SUMS.txt)"
          actual="$(sha256sum "$binary" | awk '{print $1}')"
          test "$actual" = "$expected"
          chmod +x "$binary"
          "$binary" --help
          "$binary" --version
          "$binary" collect --help
          "$binary" render --help

      - name: Install Rust toolchain for independent release-mode checks
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build independent release-mode test binary
        run: cargo build --release -p shiplog --locked

      - name: Run independent command smoke tests
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/shiplog --help
          ./target/release/shiplog --version
          ./target/release/shiplog help
          ./target/release/shiplog init --help
          ./target/release/shiplog doctor --help
          ./target/release/shiplog config --help
          ./target/release/shiplog collect --help
          ./target/release/shiplog collect github --help
          ./target/release/shiplog collect gitlab --help
          ./target/release/shiplog collect jira --help
          ./target/release/shiplog collect linear --help
          ./target/release/shiplog collect multi --help
          ./target/release/shiplog workstreams --help
          ./target/release/shiplog render --help
          ./target/release/shiplog cache --help
          ./target/release/shiplog runs --help
          ./target/release/shiplog open --help

      - name: Check versionless installers
        shell: bash
        run: |
          bash -n scripts/install.sh
          scripts/install.sh --help
          cargo metadata --no-deps --format-version 1 >/dev/null
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content scripts/install.ps1 -Raw))'
            pwsh -NoProfile -File scripts/install.ps1 --help
          fi

      - name: Generate validation summary
        shell: bash
        run: |
          {
            echo "# Release Validation Results"
            echo
            echo "- Staged candidate artifact digest: \`${{ needs.upload-assets.outputs.candidate_artifact_digest }}\`"
            echo "- Candidate manifest SHA-256: \`${{ needs.upload-assets.outputs.candidate_manifest_sha256 }}\`"
            echo "- Staged Linux candidate help/version/collect/render: **PASSED**"
            echo "- Independent release-mode command checks: **PASSED**"
            echo "- Multi-platform candidate assembly: **PASSED**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Prove the same workflow-staged bytes from empty directories on all targets.
  release-binary-acceptance:
    name: First-use ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [release-preflight, upload-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            shell: bash
            target: x86_64-unknown-linux-gnu
          - name: macOS Intel
            os: macos-15-intel
            shell: bash
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-15
            shell: bash
            target: aarch64-apple-darwin
          - name: Windows x86_64
            os: windows-latest
            shell: pwsh
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Download exact staged candidate set
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidates
          path: ${{ runner.temp }}/release-candidate

      - name: Run staged-binary first-use acceptance (Unix)
        if: matrix.shell == 'bash'
        shell: bash
        env:
          SHIPLOG_RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          SHIPLOG_RELEASE_SOURCE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
        run: bash scripts/release-install-smoke.sh "${{ needs.release-preflight.outputs.release_tag }}"

      - name: Run staged-binary first-use acceptance (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          SHIPLOG_RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          SHIPLOG_RELEASE_SOURCE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
        run: pwsh -NoProfile -File scripts/release-install-smoke.ps1 "${{ needs.release-preflight.outputs.release_tag }}"

      - name: Upload first-use diagnostics and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-first-use-${{ matrix.target }}
          path: target/release-install-smoke/${{ needs.release-preflight.outputs.release_tag }}
          if-no-files-found: warn
          retention-days: 14

  # Prove checksum and executable failures cannot satisfy the candidate gate.
  release-candidate-negative-controls:
    name: Release Candidate Negative Controls
    runs-on: ubuntu-latest
    needs: [release-preflight, upload-assets]

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Download exact staged candidate set
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidates
          path: ${{ runner.temp }}/release-candidate

      - name: Prove corrupted checksum is rejected
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/checksum-broken"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a "$RUNNER_TEMP/release-candidate/." "$root/"
          printf '\ncorrupt\n' >> "$root/shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu"

          if SHIPLOG_RELEASE_CANDIDATE_DIR="$root" \
             SHIPLOG_RELEASE_SOURCE_SHA="$RELEASE_SHA" \
             SHIPLOG_RELEASE_SMOKE_DIR="$RUNNER_TEMP/checksum-control-work" \
             bash scripts/release-install-smoke.sh "$RELEASE_TAG" \
             >"$RUNNER_TEMP/checksum-control.log" 2>&1; then
            echo "corrupted candidate unexpectedly passed" >&2
            exit 1
          fi
          grep -q "checksum mismatch" "$RUNNER_TEMP/checksum-control.log"

      - name: Prove broken executable command is rejected
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/command-broken"
          asset_rel="shiplog-x86_64-unknown-linux-gnu/shiplog-x86_64-unknown-linux-gnu"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a "$RUNNER_TEMP/release-candidate/." "$root/"

          cat > "$root/$asset_rel" <<'BROKEN'
          #!/usr/bin/env bash
          exit 42
          BROKEN
          sed -i 's/^          //' "$root/$asset_rel"
          chmod +x "$root/$asset_rel"

          replacement_sha="$(sha256sum "$root/$asset_rel" | awk '{print $1}')"
          awk -v asset="$asset_rel" -v replacement="$replacement_sha" '
            $2 == asset { print replacement "  " asset; found=1; next }
            { print }
            END { if (!found) exit 1 }
          ' "$root/SHA256SUMS.txt" > "$root/SHA256SUMS.txt.new"
          mv "$root/SHA256SUMS.txt.new" "$root/SHA256SUMS.txt"

          sums_sha="$(sha256sum "$root/SHA256SUMS.txt" | awk '{print $1}')"
          awk -F= -v OFS== -v digest="$sums_sha" '
            $1 == "checksum_manifest_sha256" { $2=digest }
            { print }
          ' "$root/RELEASE_CANDIDATE.txt" > "$root/RELEASE_CANDIDATE.txt.new"
          mv "$root/RELEASE_CANDIDATE.txt.new" "$root/RELEASE_CANDIDATE.txt"

          if SHIPLOG_RELEASE_CANDIDATE_DIR="$root" \
             SHIPLOG_RELEASE_SOURCE_SHA="$RELEASE_SHA" \
             SHIPLOG_RELEASE_SMOKE_DIR="$RUNNER_TEMP/command-control-work" \
             bash scripts/release-install-smoke.sh "$RELEASE_TAG" \
             >"$RUNNER_TEMP/command-control.log" 2>&1; then
            echo "broken candidate executable unexpectedly passed" >&2
            exit 1
          fi
          grep -q "candidate binary failed --version" "$RUNNER_TEMP/command-control.log"

      - name: Upload negative-control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-negative-controls
          path: |
            ${{ runner.temp }}/checksum-control.log
            ${{ runner.temp }}/command-control.log
          if-no-files-found: warn
          retention-days: 14

  # Run independent integration tests in release mode.
  release-test:
    name: Release Integration Tests
    runs-on: ${{ github.repository == 'EffortlessMetrics/shiplog-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    needs: [release-preflight, build-binary, create-release]

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Confirm exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-preflight.outputs.release_sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Run release tests
        run: cargo test --release --workspace --exclude shiplog-testkit --locked

      - name: Generate test summary
        if: always()
        shell: bash
        run: |
          echo "# Release Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All integration tests passed in release mode!" >> "$GITHUB_STEP_SUMMARY"

  # One terminal authority for human source-side publication.
  release-candidate-ready:
    name: Release Candidate Ready
    runs-on: ubuntu-latest
    if: always()
    needs:
      - release-preflight
      - upload-assets
      - release-validation
      - release-binary-acceptance
      - release-candidate-negative-controls
      - release-test

    steps:
      - name: Require every candidate gate
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.release-preflight.result }}
          STAGE_RESULT: ${{ needs.upload-assets.result }}
          VALIDATION_RESULT: ${{ needs.release-validation.result }}
          FIRST_USE_RESULT: ${{ needs.release-binary-acceptance.result }}
          NEGATIVE_CONTROL_RESULT: ${{ needs.release-candidate-negative-controls.result }}
          RELEASE_TEST_RESULT: ${{ needs.release-test.result }}
        run: |
          set -euo pipefail
          for result in \
            "$PREFLIGHT_RESULT" \
            "$STAGE_RESULT" \
            "$VALIDATION_RESULT" \
            "$FIRST_USE_RESULT" \
            "$NEGATIVE_CONTROL_RESULT" \
            "$RELEASE_TEST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "release candidate gate is not green: $result" >&2
              exit 1
            fi
          done

      - name: Record release candidate authority
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.upload-assets.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.upload-assets.outputs.candidate_artifact_digest }}
          CANDIDATE_MANIFEST_SHA256: ${{ needs.upload-assets.outputs.candidate_manifest_sha256 }}
          CHECKSUM_MANIFEST_SHA256: ${{ needs.upload-assets.outputs.checksum_manifest_sha256 }}
        run: |
          set -euo pipefail
          cat > release-candidate-ready.txt <<EOF
          release_tag=$RELEASE_TAG
          source_sha=$RELEASE_SHA
          candidate_artifact_id=$CANDIDATE_ARTIFACT_ID
          candidate_artifact_digest=$CANDIDATE_ARTIFACT_DIGEST
          candidate_manifest_sha256=$CANDIDATE_MANIFEST_SHA256
          checksum_manifest_sha256=$CHECKSUM_MANIFEST_SHA256
          release_validation=success
          four_platform_first_use=success
          negative_controls=success
          release_mode_tests=success
          publication_authority=source_human_approval_required
          EOF
          sed -i 's/^          //' release-candidate-ready.txt
          cat release-candidate-ready.txt

          {
            echo "# Release Candidate Ready"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source commit: \`$RELEASE_SHA\`"
            echo "- Candidate artifact id: \`$CANDIDATE_ARTIFACT_ID\`"
            echo "- Candidate artifact digest: \`$CANDIDATE_ARTIFACT_DIGEST\`"
            echo "- Candidate manifest SHA-256: \`$CANDIDATE_MANIFEST_SHA256\`"
            echo "- Checksum manifest SHA-256: \`$CHECKSUM_MANIFEST_SHA256\`"
            echo "- Four-platform first-use acceptance: **PASSED**"
            echo "- Deliberate checksum and executable failures: **REJECTED AS EXPECTED**"
            echo "- Release-mode integration tests: **PASSED**"
            echo
            echo "This is blocking candidate proof only. Tag/publication remains an explicit source-authorized human action."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release candidate ready receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-ready
          path: release-candidate-ready.txt
          retention-days: 30
